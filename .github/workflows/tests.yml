name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download JUnit dependencies
        run: |
          mkdir -p .junit
          curl -L -o .junit/junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.14.0/junit-platform-console-standalone-1.14.0.jar
      - name: Compile
        run: |
          mkdir -p build/classes build/test-classes
          find src -name '*.java' | sort > build/srcfiles.txt
          javac -d build/classes @build/srcfiles.txt
          cp src/config.properties build/classes/config.properties
          find test -name '*.java' | sort > build/testfiles.txt
          javac -cp "build/classes:.junit/junit-platform-console-standalone.jar" -d build/test-classes @build/testfiles.txt
      - name: Run tests
        run: |
          java -jar .junit/junit-platform-console-standalone.jar execute -cp "build/classes:build/test-classes" --scan-classpath
